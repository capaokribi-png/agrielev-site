<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgriElev — L'agriculture intégrée et circulaire</title>
<meta name="description" content="AgriElev conçoit des technologies, produit, distribue et forme — du logiciel au champ. Premier produit : CuniSmart, l'application de gestion d'élevage.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600;700&family=Space+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --forest:#214B2B;
  --forest-deep:#16351E;
  --forest-ink:#0F2415;
  --cream:#F2EDD9;
  --cream-soft:#F7F4E8;
  --leaf:#7FB88F;
  --leaf-soft:#DDEAD9;
  --gold:#D5A118;
  --gold-deep:#B4880F;
  --ink:#1C2B20;
  --muted:#5C6E60;
  --hair:rgba(33,75,43,.14);
  --radius:20px;
  --max:1180px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:'Instrument Sans',system-ui,sans-serif;
  background:var(--cream-soft);
  color:var(--ink);
  line-height:1.65;
  font-size:17px;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--gold);color:var(--forest-ink)}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
.wrap{max-width:var(--max);margin:0 auto;padding:0 28px}

/* ---------- utility type ---------- */
.eyebrow{
  font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--gold-deep);display:inline-flex;
  align-items:center;gap:12px;
}
.eyebrow::before{content:"";width:26px;height:1.5px;background:var(--gold)}
h1,h2,h3,.display{font-family:'Fraunces',serif;font-weight:500;line-height:1.12;color:var(--forest-deep)}
h2{font-size:clamp(30px,4.2vw,46px);letter-spacing:-.01em}
h3{font-size:21px;font-weight:600}
.lead{font-size:clamp(17px,2vw,20px);color:var(--muted);max-width:56ch}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:50;
  background:rgba(247,244,232,.86);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--hair);
}
.nav{display:flex;align-items:center;justify-content:space-between;height:74px}
.logo{display:flex;align-items:center;gap:11px;font-family:'Fraunces',serif;font-size:22px;font-weight:600;color:var(--forest-deep)}
.logo-mark{width:38px;height:38px;border-radius:11px;background:var(--forest);display:grid;place-items:center;flex:none}
.logo-mark svg{width:22px;height:22px}
.nav-links{display:flex;gap:30px;align-items:center;font-size:15px;font-weight:500}
.nav-links a{color:var(--ink);opacity:.82;transition:opacity .2s}
.nav-links a:hover{opacity:1}
.nav-cta{display:flex;align-items:center;gap:14px}
.lang{
  font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.08em;
  border:1.5px solid var(--forest);border-radius:99px;padding:7px 14px;
  background:none;cursor:pointer;color:var(--forest-deep);transition:.2s;
}
.lang:hover{background:var(--forest);color:var(--cream)}
.btn{
  display:inline-flex;align-items:center;gap:9px;border-radius:99px;
  padding:12px 24px;font-weight:600;font-size:15px;transition:.22s;cursor:pointer;border:none;
}
.btn-gold{background:var(--gold);color:var(--forest-ink)}
.btn-gold:hover{background:var(--gold-deep);transform:translateY(-1px)}
.btn-outline{border:1.5px solid var(--cream);color:var(--cream);background:transparent}
.btn-outline:hover{background:var(--cream);color:var(--forest-deep)}
.btn-forest{background:var(--forest);color:var(--cream)}
.btn-forest:hover{background:var(--forest-deep);transform:translateY(-1px)}
.burger{display:none;background:none;border:none;cursor:pointer;padding:8px}
.burger span{display:block;width:22px;height:2px;background:var(--forest-deep);margin:5px 0;border-radius:2px}

/* ---------- hero ---------- */
.hero{
  background:
    radial-gradient(120% 90% at 78% 12%,rgba(127,184,143,.22),transparent 55%),
    radial-gradient(90% 90% at 12% 90%,rgba(213,161,24,.10),transparent 50%),
    linear-gradient(168deg,var(--forest-ink),var(--forest) 62%,#2A5A36);
  color:var(--cream);position:relative;overflow:hidden;
}
.hero .wrap{
  display:grid;grid-template-columns:1.08fr .92fr;gap:56px;align-items:center;
  padding-top:88px;padding-bottom:96px;position:relative;
}
.hero h1{
  color:var(--cream);font-size:clamp(38px,5.4vw,64px);letter-spacing:-.015em;margin:22px 0 20px;
}
.hero h1 em{font-style:italic;color:var(--gold)}
.hero .eyebrow{color:var(--leaf)}
.hero .eyebrow::before{background:var(--leaf)}
.hero p{font-size:clamp(16px,1.9vw,19px);color:rgba(242,237,217,.82);max-width:52ch}
.hero-ctas{display:flex;gap:14px;margin-top:34px;flex-wrap:wrap}
.hero-meta{
  margin-top:42px;display:flex;gap:34px;flex-wrap:wrap;
  font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.1em;
  color:rgba(127,184,143,.9);
}
.hero-meta span{display:flex;align-items:center;gap:8px}
.hero-meta i{width:6px;height:6px;border-radius:50%;background:var(--gold);flex:none}

/* loop diagram */
.loop-wrap{display:grid;place-items:center}
.loop{width:min(430px,100%);filter:drop-shadow(0 18px 44px rgba(0,0,0,.28))}
.loop .ring-track{fill:none;stroke:rgba(242,237,217,.16);stroke-width:2}
.loop .ring-main{
  fill:none;stroke:var(--cream);stroke-width:5;stroke-linecap:round;
  stroke-dasharray:150 44;animation:spin 26s linear infinite;transform-origin:250px 250px;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loop text{font-family:'Space Mono',monospace;font-size:14px;letter-spacing:.14em;fill:var(--cream)}
.loop .core-t{fill:rgba(127,184,143,.85);font-size:12.5px}
@media (prefers-reduced-motion:reduce){.loop .ring-main{animation:none}}

/* ---------- flagship / CuniSmart ---------- */
.flagship{padding:110px 0;background:var(--cream-soft)}
.flag-grid{display:grid;grid-template-columns:.94fr 1.06fr;gap:64px;align-items:center;margin-top:18px}
.phone{
  width:min(300px,84%);margin:0 auto;background:var(--forest-ink);border-radius:38px;
  padding:14px;box-shadow:0 30px 70px rgba(22,53,30,.28),0 4px 14px rgba(22,53,30,.16);
}
.phone-screen{background:#FBF8EE;border-radius:27px;overflow:hidden;font-size:11.5px}
.ps-head{background:var(--forest);color:var(--cream);padding:16px 16px 13px}
.ps-head .app{font-family:'Fraunces',serif;font-size:15px}
.ps-head .app b{color:var(--gold);font-weight:600}
.ps-head .hello{opacity:.72;font-size:10.5px;margin-top:2px}
.ps-stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:13px 14px 5px}
.ps-card{background:#fff;border:1px solid var(--hair);border-radius:12px;padding:10px 12px}
.ps-card .n{font-family:'Fraunces',serif;font-size:19px;color:var(--forest-deep);font-weight:600}
.ps-card .l{color:var(--muted);font-size:10px;letter-spacing:.04em}
.ps-row{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--hair);border-radius:12px;padding:10px 12px;margin:9px 14px 0}
.ps-dot{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;font-size:14px}
.ps-row .t{font-weight:600;color:var(--forest-deep);font-size:11.5px}
.ps-row .s{color:var(--muted);font-size:10px}
.ps-foot{padding:12px 14px 15px}
.ps-btn{background:var(--gold);border-radius:10px;text-align:center;padding:9px;font-weight:700;color:var(--forest-ink);font-size:11.5px}
.flag-feats{display:grid;grid-template-columns:1fr 1fr;gap:10px 26px;margin:30px 0 34px}
.feat{display:flex;gap:11px;align-items:flex-start;font-size:15.5px}
.feat svg{flex:none;margin-top:3px}
.chip-row{display:flex;gap:9px;flex-wrap:wrap;margin-top:8px}
.chip{
  font-family:'Space Mono',monospace;font-size:11.5px;letter-spacing:.05em;
  background:var(--leaf-soft);color:var(--forest-deep);border-radius:99px;padding:6px 13px;
}

/* ---------- pillars ---------- */
.pillars{padding:110px 0;background:linear-gradient(180deg,var(--cream) 0%,var(--cream-soft) 100%);border-top:1px solid var(--hair)}
.pillars-head{max-width:640px;margin-bottom:52px}
.pillar-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
.pillar{
  background:#fff;border:1px solid var(--hair);border-radius:var(--radius);
  padding:34px 32px;position:relative;overflow:hidden;
  transition:transform .25s,box-shadow .25s;
}
.pillar:hover{transform:translateY(-4px);box-shadow:0 18px 44px rgba(22,53,30,.10)}
.pillar::after{
  content:"";position:absolute;inset:auto 0 0 0;height:4px;
  background:linear-gradient(90deg,var(--gold),var(--leaf));opacity:0;transition:opacity .25s;
}
.pillar:hover::after{opacity:1}
.pillar-ico{
  width:52px;height:52px;border-radius:15px;background:var(--forest);
  display:grid;place-items:center;margin-bottom:20px;
}
.pillar h3{margin-bottom:10px}
.pillar p{color:var(--muted);font-size:15.5px}
.pillar ul{list-style:none;margin-top:16px;display:flex;flex-direction:column;gap:7px}
.pillar li{
  font-size:14px;color:var(--forest-deep);display:flex;gap:9px;align-items:baseline;
}
.pillar li::before{content:"→";color:var(--gold);font-weight:700;flex:none}

/* ---------- cycle band ---------- */
.cycle{background:var(--forest);color:var(--cream);padding:96px 0;position:relative;overflow:hidden}
.cycle::before{
  content:"";position:absolute;width:640px;height:640px;border-radius:50%;
  border:1.5px solid rgba(242,237,217,.08);top:-260px;right:-180px;
}
.cycle h2{color:var(--cream)}
.cycle .lead{color:rgba(242,237,217,.75)}
.cycle-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:52px}
.cstep{
  background:rgba(242,237,217,.06);border:1px solid rgba(242,237,217,.14);
  border-radius:16px;padding:26px 22px;position:relative;
}
.cstep .num{font-family:'Space Mono',monospace;color:var(--gold);font-size:12px;letter-spacing:.14em}
.cstep h3{color:var(--cream);margin:9px 0 7px;font-size:18px}
.cstep p{font-size:14px;color:rgba(242,237,217,.72)}
.cstep::after{
  content:"→";position:absolute;right:-15px;top:50%;transform:translateY(-50%);
  color:var(--gold);font-size:19px;font-weight:700;
}
.cstep:last-child::after{content:"⟲";right:14px;top:20px;transform:none;opacity:.85}
.cycle-quote{
  margin-top:48px;font-family:'Fraunces',serif;font-style:italic;
  font-size:clamp(19px,2.5vw,25px);color:var(--leaf);max-width:34ch;
}

/* ---------- about / vision ---------- */
.about{padding:110px 0}
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:start}
.about-col p{color:var(--muted);margin-top:16px}
.about-col p b{color:var(--forest-deep)}
.vision-card{
  background:var(--forest-ink);color:var(--cream);border-radius:var(--radius);
  padding:42px 40px;position:sticky;top:100px;
}
.vision-card .eyebrow{color:var(--leaf)}
.vision-card .eyebrow::before{background:var(--leaf)}
.vision-card .display{color:var(--cream);font-size:clamp(22px,2.6vw,29px);margin:16px 0 14px;font-style:italic}
.vision-card p{color:rgba(242,237,217,.75);font-size:15.5px}
.geo{
  margin-top:26px;display:flex;gap:10px;flex-wrap:wrap;
}
.geo span{
  font-family:'Space Mono',monospace;font-size:11.5px;letter-spacing:.08em;
  border:1px solid rgba(242,237,217,.28);border-radius:99px;padding:6px 13px;
}

/* ---------- values ---------- */
.values{padding:0 0 110px}
.val-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:46px}
.val{
  border-top:3px solid var(--gold);background:#fff;border-radius:0 0 16px 16px;
  padding:26px 24px;border-left:1px solid var(--hair);border-right:1px solid var(--hair);border-bottom:1px solid var(--hair);
}
.val h3{font-size:18px;margin-bottom:8px}
.val p{font-size:14.5px;color:var(--muted)}

/* ---------- CTA ---------- */
.cta{
  background:
    radial-gradient(110% 130% at 88% 0%,rgba(213,161,24,.16),transparent 55%),
    var(--forest);
  color:var(--cream);padding:96px 0;text-align:center;
}
.cta h2{color:var(--cream);max-width:22ch;margin:0 auto 16px}
.cta p{color:rgba(242,237,217,.78);max-width:50ch;margin:0 auto 34px}
.cta .btn-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}

/* ---------- footer ---------- */
footer{background:var(--forest-ink);color:rgba(242,237,217,.72);padding:66px 0 40px;font-size:14.5px}
.foot-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:44px}
.foot-brand .logo{color:var(--cream);margin-bottom:14px}
.foot-col h4{
  font-family:'Space Mono',monospace;font-size:11.5px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--leaf);margin-bottom:16px;font-weight:400;
}
.foot-col a{display:block;margin-bottom:9px;opacity:.8;transition:opacity .2s}
.foot-col a:hover{opacity:1;color:var(--gold)}
.socials{display:flex;gap:12px;margin-top:20px}
.socials a{
  width:42px;height:42px;border-radius:12px;display:grid;place-items:center;
  border:1px solid rgba(242,237,217,.22);transition:.22s;opacity:1;margin:0;
}
.socials a:hover{background:var(--gold);border-color:var(--gold)}
.socials a:hover svg path,.socials a:hover svg circle{fill:#16351E}
.foot-base{
  border-top:1px solid rgba(242,237,217,.12);margin-top:52px;padding-top:26px;
  display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;
  font-family:'Space Mono',monospace;font-size:11.5px;letter-spacing:.06em;
}

/* ---------- reveal ---------- */
.reveal{opacity:0;transform:translateY(26px);transition:opacity .7s ease,transform .7s ease}
.reveal.on{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}}

/* ---------- responsive ---------- */
@media(max-width:980px){
  .hero .wrap{grid-template-columns:1fr;padding-top:64px;padding-bottom:70px}
  .loop-wrap{order:-1}
  .loop{width:min(320px,88%)}
  .flag-grid,.about-grid{grid-template-columns:1fr;gap:44px}
  .pillar-grid{grid-template-columns:1fr}
  .cycle-steps{grid-template-columns:1fr 1fr}
  .cstep::after{display:none}
  .val-grid{grid-template-columns:1fr 1fr}
  .foot-grid{grid-template-columns:1fr 1fr}
  .vision-card{position:static}
}
@media(max-width:720px){
  .nav-links{
    display:none;position:absolute;top:74px;left:0;right:0;background:var(--cream-soft);
    flex-direction:column;padding:22px 28px;border-bottom:1px solid var(--hair);gap:18px;
    align-items:flex-start;
  }
  .nav-links.open{display:flex}
  .burger{display:block}
  .nav-cta .btn{display:none}
  .val-grid,.cycle-steps,.foot-grid{grid-template-columns:1fr}
  .flag-feats{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- ============ HEADER ============ -->
<header>
  <div class="wrap nav">
    <a class="logo" href="#top">
      <span class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M12 20V9" stroke="#F2EDD9" stroke-width="2" stroke-linecap="round"/>
          <path d="M12 12C12 12 6.5 11.5 6 5C12.5 5.5 12 12 12 12Z" fill="#7FB88F"/>
          <path d="M12 14C12 14 17.5 13.5 18 7C11.5 7.5 12 14 12 14Z" fill="#F2EDD9"/>
          <circle cx="12" cy="20" r="1.6" fill="#D5A118"/>
        </svg>
      </span>
      AgriElev
    </a>
    <nav class="nav-links" id="navLinks">
      <a href="#cunismart" data-i="nav1"></a>
      <a href="#poles" data-i="nav2"></a>
      <a href="#modele" data-i="nav3"></a>
      <a href="#apropos" data-i="nav4"></a>
      <a href="#contact" data-i="nav5"></a>
    </nav>
    <div class="nav-cta">
      <button class="lang" id="langBtn" aria-label="Switch language">EN</button>
      <a class="btn btn-forest" href="https://cunismart.com" data-i="navCta"></a>
      <button class="burger" id="burger" aria-label="Menu"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>

<!-- ============ HERO ============ -->
<section class="hero" id="top">
  <div class="wrap">
    <div>
      <span class="eyebrow" data-i="heroEyebrow"></span>
      <h1 data-i-html="heroTitle"></h1>
      <p data-i="heroSub"></p>
      <div class="hero-ctas">
        <a class="btn btn-gold" href="https://cunismart.com" data-i="heroCta1"></a>
        <a class="btn btn-outline" href="#poles" data-i="heroCta2"></a>
      </div>
      <div class="hero-meta">
        <span><i></i><b data-i="meta1"></b></span>
        <span><i></i><b data-i="meta2"></b></span>
        <span><i></i><b data-i="meta3"></b></span>
      </div>
    </div>
    <div class="loop-wrap">
      <svg class="loop" viewBox="0 0 500 500" role="img" aria-label="Cycle agricole fermé">
        <circle class="ring-track" cx="250" cy="250" r="168"/>
        <circle class="ring-main" cx="250" cy="250" r="168"/>
        <circle cx="250" cy="250" r="112" fill="none" stroke="rgba(242,237,217,.10)" stroke-width="1.5"/>
        <!-- nodes -->
        <g>
          <circle cx="250" cy="82" r="43" fill="#F2EDD9"/>
          <g transform="translate(250,84)">
            <ellipse cx="-7" cy="-14" rx="4.5" ry="12" fill="#16351E"/>
            <ellipse cx="7" cy="-14" rx="4.5" ry="12" fill="#16351E"/>
            <ellipse cx="0" cy="6" rx="14" ry="12" fill="#16351E"/>
          </g>
          <text x="250" y="20" text-anchor="middle" data-i="loop1"></text>
        </g>
        <g>
          <circle cx="418" cy="250" r="43" fill="#D5A118"/>
          <g transform="translate(418,250)" fill="#16351E">
            <circle cx="-9" cy="8" r="5.5"/><circle cx="0" cy="10" r="5.5"/><circle cx="9" cy="8" r="5.5"/>
            <circle cx="-5" cy="-1" r="5.5"/><circle cx="5" cy="-1" r="5.5"/><circle cx="0" cy="-10" r="5.5"/>
          </g>
          <text x="418" y="318" text-anchor="middle" data-i="loop2"></text>
        </g>
        <g>
          <circle cx="250" cy="418" r="43" fill="#F2EDD9"/>
          <g transform="translate(250,418)" stroke="#16351E" fill="#16351E">
            <line x1="0" y1="18" x2="0" y2="-8" stroke-width="4"/>
            <path d="M0 4 Q -16 -2 -17 -13 Q -3 -12 0 4Z" stroke="none"/>
            <path d="M0 0 Q 16 -6 17 -17 Q 3 -16 0 0Z" stroke="none"/>
            <line x1="-11" y1="19" x2="11" y2="19" stroke-width="3.4"/>
          </g>
          <text x="250" y="493" text-anchor="middle" data-i="loop3"></text>
        </g>
        <g>
          <circle cx="82" cy="250" r="43" fill="#D5A118"/>
          <g transform="translate(82,250)" fill="#16351E">
            <ellipse cx="0" cy="10" rx="15" ry="5.5"/>
            <ellipse cx="0" cy="2" rx="15" ry="5.5"/>
            <ellipse cx="0" cy="-6" rx="15" ry="5.5"/>
            <ellipse cx="0" cy="-8.5" rx="15" ry="5.5" fill="#D5A118"/>
            <ellipse cx="0" cy="-11" rx="15" ry="5.5"/>
          </g>
          <text x="82" y="318" text-anchor="middle" data-i="loop4"></text>
        </g>
        <text class="core-t" x="250" y="244" text-anchor="middle" data-i="loopCore1"></text>
        <text class="core-t" x="250" y="264" text-anchor="middle" data-i="loopCore2"></text>
      </svg>
    </div>
  </div>
</section>

<!-- ============ CUNISMART ============ -->
<section class="flagship" id="cunismart">
  <div class="wrap">
    <span class="eyebrow reveal" data-i="flagEyebrow"></span>
    <div class="flag-grid">
      <div class="reveal">
        <div class="phone" aria-hidden="true">
          <div class="phone-screen">
            <div class="ps-head">
              <div class="app">Cuni<b>Smart</b></div>
              <div class="hello" data-i="psHello"></div>
            </div>
            <div class="ps-stats">
              <div class="ps-card"><div class="n">128</div><div class="l" data-i="psK1"></div></div>
              <div class="ps-card"><div class="n">+18%</div><div class="l" data-i="psK2"></div></div>
            </div>
            <div class="ps-row">
              <div class="ps-dot" style="background:#DDEAD9">🐇</div>
              <div><div class="t" data-i="psR1t"></div><div class="s" data-i="psR1s"></div></div>
            </div>
            <div class="ps-row">
              <div class="ps-dot" style="background:#F6E8C4">🌱</div>

let lang = "fr";
function applyLang(){
  const t = I18N[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i]").forEach(el=>{
    const k = el.getAttribute("data-i");
    if(t[k]!==undefined) el.textContent = t[k];
  });
  document.querySelectorAll("[data-i-html]").forEach(el=>{
    const k = el.getAttribute("data-i-html");
    if(t[k]!==undefined) el.innerHTML = t[k];
  });
  document.getElementById("langBtn").textContent = lang==="fr" ? "EN" : "FR";
}
document.getElementById("langBtn").addEventListener("click",()=>{
  lang = lang==="fr" ? "en" : "fr";
  applyLang();
});
applyLang();

/* mobile menu */
const burger=document.getElementById("burger"),navLinks=document.getElementById("navLinks");
burger.addEventListener("click",()=>navLinks.classList.toggle("open"));
navLinks.querySelectorAll("a").forEach(a=>a.addEventListener("click",()=>navLinks.classList.remove("open")));

/* scroll reveal */
const io=new IntersectionObserver(es=>{
  es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("on"); io.unobserve(e.target);} });
},{threshold:.14});
document.querySelectorAll(".reveal").forEach(el=>io.observe(el));
</script>
